let cat = "overview";

function pagesIn(id) { return PAGES.filter((item) => item.cat === id); }

function renderCats() {
  const bar = document.getElementById("cat-tabs");
  bar.replaceChildren();
  CATS.forEach(([id, label]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("role", "tab");
    button.setAttribute("aria-selected", String(id === cat));
    button.textContent = label;
    button.addEventListener("click", () => {
      cat = id;
      render();
    });
    bar.appendChild(button);
  });
}

function addTable(parent, spec) {
  if (spec.caption) {
    const p = document.createElement("p");
    p.textContent = spec.caption;
    parent.appendChild(p);
  }
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  spec.heads.forEach((text) => {
    const th = document.createElement("th");
    th.textContent = text;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  const tbody = document.createElement("tbody");
  spec.rows.forEach((row) => {
    const tr = document.createElement("tr");
    row.forEach((text) => {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  wrap.appendChild(table);
  parent.appendChild(wrap);
}

function renderSection(item) {
  const section = document.createElement("section");
  const heading = document.createElement("h2");
  heading.textContent = item.title;
  section.appendChild(heading);
  (item.body || []).forEach((text) => {
    const p = document.createElement("p");
    p.textContent = text;
    section.appendChild(p);
  });
  if (item.cards) {
    const grid = document.createElement("div");
    grid.className = "cards";
    item.cards.forEach(([id, title, text]) => {
      const button = document.createElement("button");
      button.type = "button";
      const strong = document.createElement("strong");
      strong.textContent = title;
      const span = document.createElement("span");
      span.textContent = text;
      button.append(strong, span);
      button.addEventListener("click", () => {
        cat = id;
        render();
      });
      grid.appendChild(button);
    });
    section.appendChild(grid);
  }
  if (item.steps) {
    const list = document.createElement("ol");
    list.className = "steps";
    item.steps.forEach((text) => {
      const li = document.createElement("li");
      li.textContent = text;
      list.appendChild(li);
    });
    section.appendChild(list);
  }
  (item.tables || []).forEach((spec) => addTable(section, spec));
  return section;
}

function renderPanel() {
  const panel = document.getElementById("panel");
  panel.replaceChildren();
  pagesIn(cat).forEach((item) => panel.appendChild(renderSection(item)));
}

function render() {
  renderCats();
  renderPanel();
  history.replaceState(null, "", "#" + cat);
}

const fromHash = location.hash.replace("#", "");
const matchedPage = PAGES.find((item) => item.id === fromHash);
if (CATS.some(([id]) => id === fromHash)) cat = fromHash;
else if (matchedPage) cat = matchedPage.cat;
render();
  </script>
</body>
